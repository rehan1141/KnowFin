version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: knowfin_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-knowfin}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-knowfin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: knowfin_api
    restart: always
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-knowfin}
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:-your_super_secret_key_here_must_be_32_chars_min}
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
